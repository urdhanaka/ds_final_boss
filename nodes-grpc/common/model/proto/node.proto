message Empty {}

message NodeRequirements {
  int64 cpu = 1;
  int64 memory = 2;
  int64 storage = 3;
}

message MasterRequirement {
  string token = 1;
  NodeRequirements requirements = 2;
}

message WorkerRequirement {
  string token = 1;
  NodeRequirements requirements = 2;
}

message IpAddress {
  string ip_address = 1;
}

